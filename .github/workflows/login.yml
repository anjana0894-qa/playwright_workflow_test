name: Login Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate as QA Reports GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.QA_REPORTS_APP_ID }}
          private-key: ${{ secrets.QA_REPORTS_PRIVATE_KEY }}
          owner: anjana0894-qa
          repositories: qa-reports-dashboard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Login tests
        run: npx playwright test tests/login.spec.js

      - name: Publish Login Playwright report
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/anjana0894-qa/qa-reports-dashboard.git qa-dashboard

          rm -rf qa-dashboard/reports/login
          mkdir -p qa-dashboard/reports/login

          cp -r playwright-report/. qa-dashboard/reports/login/

          cd qa-dashboard

          git config user.name "QA Reports Publisher"
          git config user.email "qa-reports-publisher@users.noreply.github.com"

          git add reports/login

          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Publish Login Playwright report"
            git push
          fi

      - name: Upload Login Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-playwright-report
          path: playwright-report/
name: Playground Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate as QA Reports GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.QA_REPORTS_APP_ID }}
          private-key: ${{ secrets.QA_REPORTS_PRIVATE_KEY }}
          owner: anjana0894-qa
          repositories: qa-reports-dashboard

      - name: Test write access to QA dashboard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/anjana0894-qa/qa-reports-dashboard.git qa-dashboard
          echo "GitHub App write access works" > qa-dashboard/test.txt

          cd qa-dashboard

          git config user.name "QA Reports Publisher"
          git config user.email "qa-reports-publisher@users.noreply.github.com"

          git add test.txt
          git commit -m "Test GitHub App write access"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test tests/playground.spec.js

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

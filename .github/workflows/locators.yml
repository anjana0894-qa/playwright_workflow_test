name: Locators Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate as QA Reports GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.QA_REPORTS_APP_ID }}
          private-key: ${{ secrets.QA_REPORTS_PRIVATE_KEY }}
          owner: anjana0894-qa
          repositories: qa-reports-dashboard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Locators tests
        id: tests
        continue-on-error: true
        run: npx playwright test tests/locators.spec.js

      - name: Set test status
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "STATUS=passed" >> "$GITHUB_ENV"
          else
            echo "STATUS=failed" >> "$GITHUB_ENV"
          fi

      - name: Publish Locators Playwright report
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/anjana0894-qa/qa-reports-dashboard.git qa-dashboard

          rm -rf qa-dashboard/reports/locators
          mkdir -p qa-dashboard/reports/locators

          cp -r playwright-report/. qa-dashboard/reports/locators/

          cat > qa-dashboard/reports/locators/metadata.json <<EOF
          {
            "module": "Locators",
            "status": "${STATUS}",
            "lastRun": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          cd qa-dashboard

          git config user.name "QA Reports Publisher"
          git config user.email "qa-reports-publisher@users.noreply.github.com"

          git add reports/locators

          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Publish Locators Playwright report"
            git push
          fi

      - name: Upload Locators Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locators-playwright-report
          path: playwright-report/

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1